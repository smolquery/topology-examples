# One Postgres backs both Milestone 8 roles of CATALOG_DATABASE_URL: the
# DuckLake catalog metadata and libcluster_postgres node discovery.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          # Every smolquery role that resolves the lake opens its own Postgrex
          # read pool (4 connections, SMOLQUERY_CATALOG_READER_POOL_SIZE) plus
          # DuckDB's libpq connections and node discovery. A fleet of eight
          # pods exhausted the default 100 (FATAL 53300 too_many_connections)
          # the moment it booted, so the limit is raised well past it.
          args: ["-c", "max_connections=500"]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: smolquery
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          # The probe is an exec, and an exec on a busy kind node can take
          # longer than the default one second to start pg_isready at all.
          # Three of those in a row mark a Postgres that is serving as not
          # Ready, its Service loses its only endpoint, every connection is
          # refused, and smolquery-api crash-loops until the rollout wait
          # gives up (T-505). So the probe gets time, and Postgres gets a
          # request, which takes it out of the BestEffort class the node
          # starves first.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
