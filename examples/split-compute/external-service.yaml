# NodePorts matched by kind/cluster.yaml's extraPortMappings. Two front
# doors, because the two tiers answer different things: writes go to the
# ingest tier on localhost:9200; queries, the web UI and psql go to the
# query tier on 9201, 9202 and 9205.
apiVersion: v1
kind: Service
metadata:
  name: smolquery-ingest-external
spec:
  type: NodePort
  selector:
    app: smolquery-api
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31200 }
---
apiVersion: v1
kind: Service
metadata:
  name: smolquery-query-external
spec:
  type: NodePort
  selector:
    app: smolquery-query
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31201 }
    - { name: web, port: 4002, targetPort: 4002, nodePort: 31202 }
    - { name: pg, port: 5432, targetPort: 5432, nodePort: 31205 }
