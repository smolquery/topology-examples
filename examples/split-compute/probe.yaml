# A test fixture, not part of the topology: one curl pod inside the
# namespace, so the suite can list the sealed bucket over RustFS's S3 API
# (curl signs with --aws-sigv4) without exposing RustFS on the host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-probe
  template:
    metadata:
      labels:
        app: s3-probe
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.22.0
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
