# Runs seed.sh (mounted from the seed-script ConfigMap) once the API is up:
# the five tables HyperDX's Logs, Traces and Metrics sources read, and the
# rows the suite asserts. The insertIds make a re-run land each row set
# once. The ConfigMap's hash suffix is off (generatorOptions), so the Job
# can name it.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-otel
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: curlimages/curl:8.22.0
          command: ["sh", "/seed/seed.sh"]
          volumeMounts:
            - name: seed-script
              mountPath: /seed
      volumes:
        - name: seed-script
          configMap:
            name: seed-script
