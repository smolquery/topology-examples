# hyperdx: ClickStack's HyperDX reading logs through smolquery's ClickHouse
# edge, per upstream docs/clickstack.md.
#
# smolquery is one pod with every role, but its DuckLake catalog is on
# Postgres: HyperDX sends its metadata queries in parallel, and several job
# engines attaching a SQLite catalog at once lock it. HyperDX keeps its own
# state in MongoDB; its connection and source are provisioned on first boot.
# A seed Job creates default.otel_logs and writes the rows the suite expects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hyperdx

resources:
  - namespace.yaml
  - ../../components/postgres
  - smolquery.yaml
  - hyperdx.yaml
  - seed-job.yaml
  - external-service.yaml

images:
  - name: smolquery
    newName: ghcr.io/chasers/smolquery
    newTag: v0.21.0

secretGenerator:
  - name: smolquery-env
    literals:
      - CATALOG_DATABASE_URL=postgres://postgres:postgres@postgres/smolquery
      - SMOLQUERY_API_KEY=kind-only-api-key
      - SMOLQUERY_INTERNAL_SECRET=kind-only-internal-secret
      - SMOLQUERY_WEB_USERNAME=smolquery
      - SMOLQUERY_WEB_PASSWORD=kind-only-web-password
      - SMOLQUERY_WEB_CHECK_ORIGIN=false
      - SMOLQUERY_SECRET_KEY_BASE=kind-only-secret-key-base-never-use-this-outside-a-local-kind-cluster
      - RELEASE_COOKIE=kind-only-cookie
      - GEN_RPC_TLS=false
      - DIST_TLS=false

generatorOptions:
  disableNameSuffixHash: true
