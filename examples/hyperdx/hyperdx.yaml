# HyperDX and the MongoDB it keeps its own state in. DEFAULT_CONNECTIONS and
# DEFAULT_SOURCES are read only when the team has no connection and no
# source, which is the first boot against an empty database; to change
# either, delete the mongo pod (its volume is an emptyDir) and let HyperDX
# boot again. The sources are the ones docs/clickstack.md gives, on
# default.otel_logs, default.otel_traces and default.otel_metrics_*; the
# connection's host must be a name, not an IP.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:5.0.32-focal
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hyperdx
spec:
  selector:
    app: hyperdx
  ports:
    - name: app
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperdx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyperdx
  template:
    metadata:
      labels:
        app: hyperdx
    spec:
      containers:
        - name: hyperdx
          image: docker.hyperdx.io/hyperdx/hyperdx:2.41.0
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/hyperdx
            - name: FRONTEND_URL
              value: http://localhost:9408
            - name: DEFAULT_CONNECTIONS
              value: >-
                [{"name":"smolquery","host":"http://smolquery:8123","username":"default","password":"kind-only-api-key"}]
            # HyperDX's stock three sources (its docker-compose.yml) without
            # metadataMaterializedViews, which name rollup tables that do
            # not exist here, and without the Sessions source. The sources
            # name each other, so a trace shows its logs and a log its trace.
            - name: DEFAULT_SOURCES
              value: >-
                [{"name":"Logs","kind":"log","connection":"smolquery",
                  "from":{"databaseName":"default","tableName":"otel_logs"},
                  "timestampValueExpression":"Timestamp",
                  "displayedTimestampValueExpression":"Timestamp",
                  "implicitColumnExpression":"Body",
                  "bodyExpression":"Body",
                  "serviceNameExpression":"ServiceName",
                  "severityTextExpression":"SeverityText",
                  "eventAttributesExpression":"LogAttributes",
                  "resourceAttributesExpression":"ResourceAttributes",
                  "traceIdExpression":"TraceId",
                  "spanIdExpression":"SpanId",
                  "defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body",
                  "traceSourceId":"Traces","metricSourceId":"Metrics"},
                 {"name":"Traces","kind":"trace","connection":"smolquery",
                  "from":{"databaseName":"default","tableName":"otel_traces"},
                  "timestampValueExpression":"Timestamp",
                  "displayedTimestampValueExpression":"Timestamp",
                  "implicitColumnExpression":"SpanName",
                  "serviceNameExpression":"ServiceName",
                  "eventAttributesExpression":"SpanAttributes",
                  "resourceAttributesExpression":"ResourceAttributes",
                  "defaultTableSelectExpression":"Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName",
                  "traceIdExpression":"TraceId","spanIdExpression":"SpanId",
                  "durationExpression":"Duration","durationPrecision":9,
                  "parentSpanIdExpression":"ParentSpanId","spanNameExpression":"SpanName",
                  "spanKindExpression":"SpanKind","statusCodeExpression":"StatusCode",
                  "statusMessageExpression":"StatusMessage",
                  "logSourceId":"Logs","metricSourceId":"Metrics"},
                 {"name":"Metrics","kind":"metric","connection":"smolquery",
                  "from":{"databaseName":"default","tableName":""},
                  "timestampValueExpression":"TimeUnix",
                  "resourceAttributesExpression":"ResourceAttributes",
                  "metricTables":{"gauge":"otel_metrics_gauge","sum":"otel_metrics_sum",
                                  "histogram":"otel_metrics_histogram"},
                  "logSourceId":"Logs","traceSourceId":"Traces"}]
          ports:
            - containerPort: 8080
              name: app
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
