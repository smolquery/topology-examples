# HyperDX and the MongoDB it keeps its own state in. DEFAULT_CONNECTIONS and
# DEFAULT_SOURCES are read only when the team has no connection and no
# source, which is the first boot against an empty database; to change
# either, delete the mongo pod (its volume is an emptyDir) and let HyperDX
# boot again. The source is the one docs/clickstack.md gives, on
# default.otel_logs; the connection's host must be a name, not an IP.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:5.0.32-focal
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hyperdx
spec:
  selector:
    app: hyperdx
  ports:
    - name: app
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperdx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyperdx
  template:
    metadata:
      labels:
        app: hyperdx
    spec:
      containers:
        - name: hyperdx
          image: docker.hyperdx.io/hyperdx/hyperdx:2.40.0
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/hyperdx
            - name: FRONTEND_URL
              value: http://localhost:9408
            - name: DEFAULT_CONNECTIONS
              value: >-
                [{"name":"smolquery","host":"http://smolquery:8123","username":"default","password":"kind-only-api-key"}]
            - name: DEFAULT_SOURCES
              value: >-
                [{"name":"Logs","kind":"log","connection":"smolquery",
                  "from":{"databaseName":"default","tableName":"otel_logs"},
                  "timestampValueExpression":"Timestamp",
                  "displayedTimestampValueExpression":"Timestamp",
                  "implicitColumnExpression":"Body",
                  "bodyExpression":"Body",
                  "serviceNameExpression":"ServiceName",
                  "severityTextExpression":"SeverityText",
                  "eventAttributesExpression":"LogAttributes",
                  "resourceAttributesExpression":"ResourceAttributes",
                  "traceIdExpression":"TraceId",
                  "spanIdExpression":"SpanId",
                  "defaultTableSelectExpression":"Timestamp,ServiceName,SeverityText,Body"}]
          ports:
            - containerPort: 8080
              name: app
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
