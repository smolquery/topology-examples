# NodePorts matched by kind/cluster.yaml's extraPortMappings: on the host,
# the API is localhost:9400, HyperDX 9408 and the ClickHouse edge 9423.
apiVersion: v1
kind: Service
metadata:
  name: smolquery-external
spec:
  type: NodePort
  selector:
    app: smolquery
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31400 }
    - { name: clickhouse, port: 8123, targetPort: 8123, nodePort: 31423 }
---
apiVersion: v1
kind: Service
metadata:
  name: hyperdx-external
spec:
  type: NodePort
  selector:
    app: hyperdx
  ports:
    - { name: app, port: 8080, targetPort: 8080, nodePort: 31408 }
