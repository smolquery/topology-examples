# NodePorts matched by kind/cluster.yaml's extraPortMappings: on the host,
# the API is localhost:9100, the web UI 9102, the Postgres wire listener
# 9105, the ClickHouse edge 9123 and the VictoriaMetrics edge 9128.
apiVersion: v1
kind: Service
metadata:
  name: smolquery-external
spec:
  type: NodePort
  selector:
    app: smolquery
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31100 }
    - { name: web, port: 4002, targetPort: 4002, nodePort: 31102 }
    - { name: pg, port: 5432, targetPort: 5432, nodePort: 31105 }
    - { name: clickhouse, port: 8123, targetPort: 8123, nodePort: 31123 }
    - { name: victoriametrics, port: 8428, targetPort: 8428, nodePort: 31128 }
