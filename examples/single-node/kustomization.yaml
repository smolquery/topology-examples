# single-node: the whole of smolquery in one pod.
#
# One StatefulSet with SMOLQUERY_ROLES=all, the DuckLake catalog in SQLite on
# the pod's volume, the sealed tier on the same volume, and every protocol
# edge bound so the host can reach it. No Postgres, no object store: one
# directory holds everything durable, and backing it up backs smolquery up.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: single-node

resources:
  - namespace.yaml
  - smolquery.yaml
  - external-service.yaml

images:
  - name: smolquery
    newName: ghcr.io/chasers/smolquery
    newTag: v0.21.0

# kind-only literals, as upstream's kind overlay does it. Nothing here is
# meant to be reachable from outside a laptop.
secretGenerator:
  - name: smolquery-env
    literals:
      - SMOLQUERY_API_KEY=kind-only-api-key
      - SMOLQUERY_WEB_USERNAME=smolquery
      - SMOLQUERY_WEB_PASSWORD=kind-only-web-password
      - SMOLQUERY_WEB_CHECK_ORIGIN=false
      - SMOLQUERY_SECRET_KEY_BASE=kind-only-secret-key-base-never-use-this-outside-a-local-kind-cluster
      - SMOLQUERY_CREDENTIAL_KEY=a2luZC1vbmx5LWNyZWRlbnRpYWwta2V5LTMyLWJ5dGVzIQ==

generatorOptions:
  disableNameSuffixHash: true
