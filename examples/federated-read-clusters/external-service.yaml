# NodePorts matched by kind/cluster.yaml's extraPortMappings: the writer's
# API is localhost:9300, reader-1's is 9301 and reader-2's is 9302.
apiVersion: v1
kind: Service
metadata:
  name: writer-external
spec:
  type: NodePort
  selector:
    app: smolquery-api
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31300 }
---
apiVersion: v1
kind: Service
metadata:
  name: reader-1-external
spec:
  type: NodePort
  selector:
    app: reader-1
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31301 }
---
apiVersion: v1
kind: Service
metadata:
  name: reader-2-external
spec:
  type: NodePort
  selector:
    app: reader-2
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31302 }
