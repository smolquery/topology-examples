# Two readers, each its own smolquery: api, query and web only. No buffer
# or storage role, no CATALOG_DATABASE_URL, so a reader is not a member of
# the writer's cluster. Its own DuckLake catalog is a database of its own
# on the shared Postgres (reader_1, reader_2; see postgres-init.yaml) that
# holds nothing but the connection row naming the writer's lake: SQLite
# would lock under the probe's engine and a query job together. A reader's
# query jobs read the lake's Parquet files straight from RustFS; the writer
# never sees them.
#
# They are not labelled cluster=smolquery on purpose: that label is what
# the writer's headless Service selects.
apiVersion: v1
kind: Service
metadata:
  name: reader-1
spec:
  selector:
    app: reader-1
  ports:
    - { name: http, port: 4000 }
    - { name: web, port: 4002 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reader-1
spec:
  serviceName: reader-1
  replicas: 1
  selector:
    matchLabels:
      app: reader-1
  template:
    metadata:
      labels:
        app: reader-1
        role: reader
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 1; done"]
      containers:
        - name: smolquery
          image: smolquery
          envFrom:
            - secretRef:
                name: reader-env
          env:
            - name: SMOLQUERY_ROLES
              value: api,query,web
            - name: SMOLQUERY_CATALOG
              value: "postgres:host=postgres dbname=reader_1 user=postgres password=postgres"
          ports:
            - { name: http, containerPort: 4000 }
            - { name: web, containerPort: 4002 }
            - { name: metrics, containerPort: 4003 }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
