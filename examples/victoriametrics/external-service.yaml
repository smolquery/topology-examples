# NodePorts matched by kind/cluster.yaml's extraPortMappings: on the host,
# the API is localhost:9500, the VictoriaMetrics edge 9528, Grafana 9530.
apiVersion: v1
kind: Service
metadata:
  name: smolquery-external
spec:
  type: NodePort
  selector:
    app: smolquery
  ports:
    - { name: http, port: 4000, targetPort: 4000, nodePort: 31500 }
    - { name: victoriametrics, port: 8428, targetPort: 8428, nodePort: 31528 }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-external
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - { name: http, port: 3000, targetPort: 3000, nodePort: 31530 }
